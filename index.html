<!--está é a base do site ou seja onde praticamente tudo aqui é padrão mas sem isso não funciona mas tem coisas que
prescisam mudar como por exemplo a língua, se você não colocar vai ficar com o site em língua inglesa, e també o title 
que quando alguém vai pesquisar no google, caso esteja parecido com oque está escrito dentro do title o site vai aparecer
e também o <link rel="stylesheet" href="style.css"> que faz que as caracteristicas visuais ou seja a aparências das coisas
sera utilizado o arquico do css-->
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta do clima</title>
    <link rel="stylesheet" href="style.css">
</head>


<!--aqui fica o body ou seja tudo aqui dentro é o principal, junto com o center que vai centralizar tudo no meio da página
, o div class="caixa" faz com que caso no style eu va e coloque .caixa eu posso nodificar tudo da aparência pelo css,
o h1 mostra o título principal, já o div class ="pesquisa" é a mesma coisa com a caixa mas simboliza a pesquisa, o input
deixa o usuário conseguir escrever dentro dele a pesquisa do local, o <input type="text" placeholder="Digite uma cidade ">
mostra dentro da caixa oque deve ser copiado, o button mostra um botão para a pesquisa da cidade, o buscar apenas mostra oque
o botão estará escrito, o <p> significa parágrafo ou seja tudo dentro dele é uma paraágrafo-->

<body>
    <main class="container">

    
    <center>
        <div class="caixa">
            <h1>Consulta do clima</h1>
            <div class="pesquisa">
                <input type="text" id="cidade" placeholder="Digite uma cidade ">
                <button id="buscar">
                    Buscar
                </button>
            </div>
            <p>Digite uma cidade para oonsultar</p>
        </div>
    </center>
    <section id="resultados ">
    </section>
</main>
<script src="script.js"></script>
</body>

</html>
